{% extends 'new.html' %}

{%block botones%}

<div class="container my-4">
  <div class="row g-3 align-items-end">   <!-- g-3 = gap between cols -->

    <!-- 1. Cliente -->
    <div class="col-md-4">
      <label for="clientId" class="form-label fw-bold">Seleccionar cliente</label>
      <select class="form-select" id="clientId" name="clientId">
        <option value="">Seleccione un cliente</option>
        {% for client in clients %}
          <option value="{{ client.id }}">{{ client.name }}</option>
        {% endfor %}
      </select>
      <small class="form-text text-muted">Por defecto: "Mostrador".</small>
    </div>

    <!-- 2. Tipo de venta -->
    <div class="col-md-4">
      <label for="tipoVenta" class="form-label fw-bold">Tipo de venta</label>
      <select id="tipoVenta" class="form-select">
        <option value="mayoreo">Mayoreo</option>
        <option value="menudeo" selected>Menudeo</option>
      </select>
    </div>

    <!-- 3. Monedero -->
    <div class="col-md-4">
      <lbel for="btnMonedero" class="form-label fw-bold">Uso de monedero</label>
      <select class="form-select" id="btnMonedero">
        <option value="0">No monedero</option>
        <option value="1">Compra con monedero</option>
      </select>
    </div>

  </div>
</div>

{%endblock%}
{%block lastBotones%}
<div class="card-footer">
		<a href="/sale/last" class="btn btn-success btn-flat" id="{{btnId}}">
			<i class="fas fa-folder-open"></i>Ultima Venta</a>
        </div>
{%endblock%}

{% block dateFilter %}
<div class="card-footer">
    <!-- Date Filter Form -->
    <form method="get" action="{% url 'crm:saleList' %}" class="mt-3 d-flex align-items-center">
        <label for="start_date" class="me-2">Fecha Inicial: </label>
        <input type="date" id="start_date" name="start_date" value="{{ start_date|default_if_none:'' }}" class="form-control me-2" style="width: auto;">
        
        <label for="end_date" class="me-2">Fecha Final:  </label>
        <input type="date" id="end_date" name="end_date" value="{{ end_date|default_if_none:'' }}" class="form-control me-2" style="width: auto;">
        
        <button type="submit" class="btn btn-primary">Filtrar </button>
    </form>
</div>
{% endblock %}
