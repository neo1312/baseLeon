{% extends 'list.html' %}

{% block columns %}
    <tr>
        <th scope="col">Id</th>
        <th scope="col">Cliente</th>
        <th scope="col">Monedero</th>
        <th scope="col">Importe</th>
        <th scope="col">Fecha</th>
        <th scope="col">Opciones</th>
    </tr>
{% endblock %}

{% block rows %}
    {% for o in quotes %}
        <tr>
            <td>{{ o.id }}</td>
            <td>{{ o.client }}</td>
            <td>{{ o.monedero }}</td>
            <td>$ {{ o.get_cart_total|floatformat:2 }}</td>
            <td>{{ o.date_created }}</td>
            <td>
                <a href="/quote/pdfprint/{{ o.id }}" class="btn btn-secondary btn-xs btn-flat">
                    <i class="fas fa-print"></i>
                </a>
                <a href="#" class="btn btn-success btn-xs btn-flat quote-to-sale-btn" data-quote-id="{{ o.id }}">
                    <i class="fas fa-arrow-right"></i> Sale
                </a>
            </td>
        </tr>
    {% endfor %}
{% endblock %}

<script>
document.querySelectorAll('.quote-to-sale-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        const quoteId = this.getAttribute('data-quote-id');
        convertQuoteToSale(quoteId);
    });
});

function convertQuoteToSale(quoteId) {
    console.log('Converting quote ' + quoteId);
    
    // Check stock before converting
    fetch('/quote/check-stock/' + quoteId + '/', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken'),
        }
    })
    .then(function(response) {
        return response.json();
    })
    .then(function(data) {
        console.log('Stock check response:', data);
        if (data.success) {
            // All stock available, proceed with conversion
            alert('✓ Stock validated! Converting quote ' + quoteId + ' to sale...');
            window.location.href = '/quote/to-sale/' + quoteId + '/';
        } else {
            // Show error with details
            var message = '✗ Cannot convert quote - insufficient stock:\n\n';
            if (data.details && data.details.length > 0) {
                data.details.forEach(function(item) {
                    message += item.product + ':\n  Required: ' + item.requested + '\n  Available: ' + item.available + '\n\n';
                });
            } else {
                message += data.error || 'Unknown error';
            }
            alert(message);
        }
    })
    .catch(function(error) {
        console.error('Error:', error);
        alert('❌ Error checking stock: ' + error.message);
    });
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
